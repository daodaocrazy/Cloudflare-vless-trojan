name: Deploy Vless Pages

on:
  workflow_dispatch:

concurrency:
  group: deploy-vless-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Prepare Pages worker
        run: cp Vless_workers_pages/_worker明.js /tmp/cfpage-worker.js && mkdir -p .pages-dist && cp /tmp/cfpage-worker.js .pages-dist/_worker.js

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN_GMAIL }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_GMAIL }}
          command: pages deploy .pages-dist --project-name=cfbridge-pages --branch=main